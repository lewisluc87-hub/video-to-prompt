[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "video2prompt"
version = "0.1.0"
description = "Turn a video into text prompts for AI video generation models (Sora, Runway, Veo)."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Lewis Luc" }]
dependencies = [
    "typer>=0.12",
    "pydantic>=2.6",
    "opencv-python-headless>=4.9",
    "numpy>=1.26",
    "scenedetect>=0.6.4",
    "ffmpeg-python>=0.2.0",
    "colorthief>=0.2.1",
    "rich>=13.7",
    "pyyaml>=6.0",
    "python-dotenv>=1.0",
]

[project.optional-dependencies]
llm = ["anthropic>=0.34"]
objects = ["ultralytics>=8.2"]
transcribe = ["faster-whisper>=1.0"]
ocr = ["pytesseract>=0.3.10", "Pillow>=10.0", "wordninja>=2.0"]
dev = ["pytest>=8.0", "ruff==0.16.4"]
all = ["video2prompt[llm,objects,transcribe,ocr,dev]"]

[project.scripts]
video2prompt = "video2prompt.cli:app"

[tool.setuptools.packages.find]
where = ["src"]
